<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Asignaturas</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header class="header">
    <div class="menu-icon">
      <i class="fas fa-bars"></i>
    </div>
    <div class="header-title">
      <i class="fas fa-graduation-cap"></i>
      <span>Asignaturas</span>
    </div>
    <div class="profile">
      <i class="fas fa-user-circle"></i>
      <span>Aaron Cisneros</span>
    </div>
  </header>

  <main class="container">
    <h2 class="subjects-title">Mis Asignaturas</h2>
    <div class="filters">
      <button class="filter-btn active">Semestre</button>
      <button class="filter-btn">Cuatrimestre</button>
    </div>
    <div class="subjects-grid">
      <div class="card">
        <div class="icon-box" style="background-color: #FFD700;"><i class="fas fa-book-open"></i></div>
        <div class="info">
          <h4>Administración Estratégica</h4>
          <p>Grupo-1 | Diurno</p>
          <p>IC-2025</p>
          <p>27 Alumnos</p>
        </div>
      </div>
      <div class="card">
        <div class="icon-box" style="background-color: #87CEFA;"><i class="fas fa-database"></i></div>
        <div class="info">
          <h4>Programación Lógica</h4>
          <p>Grupo-1 | Diurno</p>
          <p>IC-2025</p>
          <p>27 Alumnos</p>
        </div>
      </div>
      <div class="card">
        <div class="icon-box" style="background-color: #D3D3D3;"><i class="fab fa-github"></i></div>
        <div class="info">
          <h4>Programación Web</h4>
          <p>Grupo-1 | Diurno</p>
          <p>IC-2025</p>
          <p>27 Alumnos</p>
        </div>
      </div>
      <div class="card">
        <div class="icon-box" style="background-color: #FFA07A;"><i class="fas fa-code"></i></div>
        <div class="info">
          <h4>Lenguaje de Programación II</h4>
          <p>Grupo-1 | Diurno</p>
          <p>IC-2025</p>
          <p>27 Alumnos</p>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
